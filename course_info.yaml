course:
  name: "Digital Operations (MBA)"
  code: "DIGOPS-601"
  semester: "Spring 2026"
  professor: "Prof. [Your Name]"
  office_hours: "Tuesdays and Thursdays, 2–4 PM (Room 210)"
  email: "professor@university.edu"
  location: "Room 305, Business School"
  schedule: "Mondays & Wednesdays, 6:00–7:30 PM"

description: |
  This course explores how digital technologies transform business operations.
  Topics include process automation, data-driven decision making, platform
  economics, supply chain digitization, and the organizational challenges of
  digital transformation.

grading:
  - component: "Class Participation"
    weight: "15%"
  - component: "Weekly Case Memos (8 total)"
    weight: "20%"
  - component: "Midterm Exam"
    weight: "20%"
  - component: "Group Project – Digital Ops Audit"
    weight: "25%"
  - component: "Final Exam"
    weight: "20%"

